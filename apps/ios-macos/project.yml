name: Likeminded

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"

packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: 2.0.0
  LiveKitWebRTC:
    url: https://github.com/livekit/webrtc-xcframework.git
    exactVersion: 144.7559.10
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

settings:
  base:
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    DEVELOPMENT_TEAM: 9UPQL479Z5

targets:
  Likeminded:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/LikemindedApp
      - path: Sources/Shared
      - path: Sources/DoodleArt
      - path: Assets.xcassets
    dependencies:
      - package: LiveKit
      - package: LiveKitWebRTC
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: Info/Likeminded-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gurusharan.likeminded
        PRODUCT_NAME: Likeminded
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Likeminded
        INFOPLIST_KEY_LIKEMINDED_API_BASE_URL: "$(LIKEMINDED_API_BASE_URL)"
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Likeminded uses your camera for scheduled group video meets."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Likeminded uses your voice to build private profile signals and suggest a starter circle."
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Entitlements/Likeminded.entitlements
        DEVELOPMENT_ASSET_PATHS: "\"\""
        LIKEMINDED_API_BASE_URL: ""
        GOOGLE_CLIENT_ID_IOS: ""
        GOOGLE_REVERSED_CLIENT_ID: ""
    scheme:
      gatherCoverageData: false
      testTargets: []

  LikemindedMac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/LikemindedMac
      - path: Sources/LikemindedApp/Data/RealtimeVoiceClient.swift
      - path: Sources/Shared
      - path: Sources/DoodleArt
      - path: Assets.xcassets
    dependencies:
      - package: LiveKit
      - package: LiveKitWebRTC
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: Info/LikemindedMac-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gurusharan.likeminded
        PRODUCT_NAME: LikemindedMac
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Likeminded
        INFOPLIST_KEY_LIKEMINDED_API_BASE_URL: "$(LIKEMINDED_API_BASE_URL)"
        INFOPLIST_KEY_NSCameraUsageDescription: "Likeminded uses your camera for scheduled group video meets."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Likeminded uses your voice to build private profile signals and suggest a starter circle."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Entitlements/LikemindedMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        DEVELOPMENT_ASSET_PATHS: "\"\""
        LIKEMINDED_API_BASE_URL: ""
        GOOGLE_CLIENT_ID_IOS: ""
        GOOGLE_REVERSED_CLIENT_ID: ""
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Entitlements/LikemindedMac.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Entitlements/LikemindedMac.entitlements
    scheme:
      gatherCoverageData: false
      testTargets: []
