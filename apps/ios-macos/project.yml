name: Likeminded

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"

packages:
  LiveKitWebRTC:
    url: https://github.com/livekit/webrtc-xcframework.git
    exactVersion: 144.7559.10

settings:
  base:
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0

targets:
  Likeminded:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/LikemindedApp
    dependencies:
      - package: LiveKitWebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.likeminded.prototype
        PRODUCT_NAME: Likeminded
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Likeminded
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Likeminded uses your voice to build private profile signals and suggest a starter circle."
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_ASSET_PATHS: "\"\""
    scheme:
      gatherCoverageData: false
      testTargets: []
