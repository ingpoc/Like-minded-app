services:
  - type: web
    name: likeminded-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run migrate:api
    startCommand: npm run dev:api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime-2
      - key: OPENAI_REALTIME_VOICE
        value: marin
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: APPLE_BUNDLE_ID
        value: com.gurusharan.likeminded
      - key: APPLE_CLIENT_ID
        value: com.gurusharan.likeminded
      - key: APPLE_MAC_BUNDLE_ID
        value: com.gurusharan.likeminded
      - key: APPLE_CLIENT_IDS
        value: com.gurusharan.likeminded
      - key: APPLE_REQUIRE_NONCE
        value: "1"
      - key: APPLE_AUTH_BYPASS
        value: "0"
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: GOOGLE_AUTH_BYPASS
        value: "0"
      - key: WALLETCONNECT_PROJECT_ID
        sync: false
      - key: WALLET_AUTH_BYPASS
        value: "0"
      - key: WALLET_AUTH_URI
        value: https://likeminded.app
